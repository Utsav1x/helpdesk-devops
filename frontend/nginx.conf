# This server uses an unprivileged port and React client-side routing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    # Docker DNS refreshes the backend address after a deployment or rollback.
    resolver 127.0.0.11 valid=5s;
    set $backend http://backend:8000;
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
}
