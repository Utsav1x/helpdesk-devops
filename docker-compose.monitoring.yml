# Merge with docker-compose.yml so monitoring joins the selected app environment.
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    networks: [app]
    depends_on:
      prometheus: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    # Read-only host mounts expose Linux container metrics. Docker Desktop support varies.
    privileged: true
    command: ['--docker_only=true', '--housekeeping_interval=10s']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports: ['127.0.0.1:${CADVISOR_PORT:-8082}:8080']
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:8080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
# Historical metrics and dashboards survive a regular compose down.
volumes:
  prometheus-data:
  grafana-data:
